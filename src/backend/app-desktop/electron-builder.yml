appId: com.saasrestaurante.app
productName: SaaS Restaurante
copyright: Copyright © 2026 SaaS Restaurante

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - src/out/**/*
  - resources/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/
  category: Office

publish:
  provider: github
  owner: Tanattos18
  repo: saas-restaurante
  private: false
